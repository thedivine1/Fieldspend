<!-- Fieldspend Logo — circular badge with 'FS' initials
     SplashScreen should reference this as /logo.svg (not /logo.png)
     Size: 200x200px
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(14,165,233,0.35)" />
    </filter>
  </defs>
  <!-- Outer circle with gradient -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <!-- 'FS' initials -->
  <text
    x="100"
    y="118"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="68"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2"
    style="paint-order: stroke; stroke: rgba(0,0,0,0.08); stroke-width: 4px;"
  >FS</text>
</svg>
